<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5ef" />
    <title>EthnoMart — Coming soon</title>
    <meta
      name="description"
      content="EthnoMart is coming soon. A place for multicultural shops, clothing, communities, events and local opportunities."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="EthnoMart — Coming soon" />
    <meta
      property="og:description"
      content="Your culture. Your neighbourhood. We're building a place to feel at home."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/mona-sans-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/coming-soon.css" />
  </head>
  <body>
    <main class="coming-soon" aria-labelledby="coming-soon-title">
      <img
        class="coming-soon-logo"
        src="/brand/ethnomart-logo.png"
        alt="EthnoMart"
        width="2000"
        height="435"
        fetchpriority="high"
        decoding="async"
      />
      <p class="coming-soon-tagline">Your culture. Your neighbourhood.</p>
      <h1 id="coming-soon-title">Coming soon.</h1>
      <p class="coming-soon-message">
        We're building a place for shops, clothing, communities, events and
        local opportunities.
      </p>
      <p class="coming-soon-status">
        <span aria-hidden="true"></span>Good things are taking shape.
      </p>
    </main>
  </body>
</html>
